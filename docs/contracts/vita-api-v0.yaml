openapi: 3.1.0
info:
  title: Vita API
  version: 0.9.0
  description: |
    Contract v0 — auth, user profile, log entries, AI parse. App-team review
    complete 2026-07-13 (`app/Doc/contract-review-v0.md`): approved, with two
    edits applied in 0.2.0 (muscles enum, drafts maxItems — backend ADR-0010).
    0.3.0 adds plan/program parse-import for onboarding steps 3-4 (two parse
    endpoints + a presigned-upload endpoint — backend ADR-0011).
    0.4.0 is an additive "Vita 100% local" bump (backlog-local-100): it starts
    with GET /entries gaining `from`/`to` and a CSV `type` filter (BE-017);
    plan/program history+edit, `/me/vacations`, and the `checkin` entry type
    land in later 0.4.0 tickets. No 0.3.0 consumer breaks.
    0.5.0 adds `Exercise.muscles` (per-exercise muscle tinting) — additive,
    optional; the workout-level `WorkoutDetail.muscles` is unchanged.
    0.6.0 (meal-plan/workout-plan round — all additive): PlanItem gains
    id/microsPerUnit/portion; GET /plan may return the sparse `portions`
    overlay; PUT /plan/portions replaces it; Exercise gains muscleRoles.
    Old clients ignore every new field; no 0.5.0 consumer breaks.
    0.7.0 (V3 plan round): the full v3 plan model — PlanMeal gains
    kcal/note/options/usualOptionIndex, PlanItem gains grams/swaps/usualSwapIndex,
    EatingPlanDraft gains status/hydration/supplements/note. ONE BREAKING CHANGE:
    POST /parse/eating-plan is now asynchronous (202 + job id; on success the
    parsed plan is SAVED as the current version with status "review") — poll
    GET /parse/eating-plan/jobs/{jobId}, then GET /plan. Everything else is
    additive; /parse/training-program is unchanged (sync).
    0.8.0 (V4 day-record round — ALL ADDITIVE, no 0.7.0 consumer breaks):
    MealDetail gains planMealId/planStatus/planOptionIndex and relaxes `items`
    to minItems 0 (a skipped plan meal is a record with no items); MealItem
    gains replacesItemId; WorkoutDetail gains planDay/planStatus; a new
    `weight` entry type + WeightDetail carries manually logged body weight
    (Health-Connect readings stay device-local, ADR-0016); PlanMeal gains a
    stable `id` ("m-1"…"m-N"); /parse/text and /parse/photo become plan-aware
    (same request/response shapes, the drafts may now carry the plan fields);
    new GET/PUT /me/settings stores an opaque encrypted settings blob so the
    device-local settings bundle survives a reinstall; new public GET /privacy
    serves the privacy policy. Day status ("unrecorded" / "as planned" /
    "adjusted") is DERIVED from these records — there is no /days resource and
    no `planned` wire value. See ADR-0019.
    0.9.0 (v4.2 manual builders — additive except D1, a relaxation): a plan or
    program built by hand in the app rides the SAME save paths (POST /plan,
    POST /program) as an imported one — no new resource. PlanMeal.items relaxes
    to minItems 0 (a named slot with no food yet); PlanItem gains `kcal` (the
    TOTAL for the stated quantity, not per unit) + `kcalEstimated`; Exercise
    gains `durationMin` (the time family's minutes) and `wholeBody`; `traps`
    joins the muscle vocabulary (it used to fold into `back`); three new
    estimate endpoints — POST /estimate/food-kcal, /estimate/exercise-muscles
    and /estimate/workout-kcal — answer the "fill it in for me" passes from a
    seeded reference table first, a cache second, and the model only for what
    both miss. Every number they return is an ESTIMATE, never a target, and is
    flagged as one. See ADR-0020.
    Governed by ADR-0006 (contract-first REST, RFC 7807, cursor pagination)
    and ADR-0005 (AI drafts are never persisted server-side).

    Conventions:
    - Base path /v1, JSON, camelCase.
    - Auth: `Authorization: Bearer <accessToken>` (JWT, ~15 min) unless marked public.
    - All errors are RFC 7807 application/problem+json.
    - Timestamps are RFC 3339 date-time with offset.
servers:
  - url: /v1
    description: Placeholder — API Gateway default URL until a domain is purchased (CEO Round 3).

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: account
  - name: entries
  - name: parse
  - name: uploads
  - name: plans
  - name: estimate
  - name: public

paths:
  # ── Auth ────────────────────────────────────────────────────────────────
  /auth/magic-link:
    post:
      tags: [auth]
      summary: Request a magic-link email
      description: |
        Always returns 202 with an identical body whether or not the email is
        registered (no account enumeration). Rate-limited per email and per IP.
        The email contains a link that opens the app with a single-use token
        (15-min expiry).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Accepted (regardless of whether the email is registered).
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/magic-link/verify:
    post:
      tags: [auth]
      summary: Exchange a magic-link token for a session
      description: |
        Consumes the single-use token from the email deep link. Creates the
        account on first sign-in. Signing in during a pending account deletion
        cancels the deletion (ADR-0004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Opaque token from the magic-link URL.
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Token invalid, expired, or already consumed.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/link:
    get:
      tags: [auth]
      summary: Magic-link redirect (email entry door)
      description: |
        The https URL the magic-link email points at — email clients only
        auto-link/allow http(s), so a raw `vita://auth` link is dead text.
        Redirects (302) to `vita://auth?token=<token>` so the phone opens the
        app, and serves a minimal HTML body with a tappable `vita://` anchor as
        a fallback for clients that don't follow custom-scheme redirects. The
        token is opaque and passed through untouched — it is verified only by
        POST /auth/magic-link/verify. Not called by the app; the browser follows
        it from the email.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Opaque single-use token from the email.
      responses:
        "302":
          description: Redirect to the app scheme.
          headers:
            Location:
              schema:
                type: string
              description: "`vita://auth?token=<token>`"
          content:
            text/html:
              schema:
                type: string
        default: { $ref: "#/components/responses/Problem" }

  /auth/oidc:
    post:
      tags: [auth]
      summary: Sign in with a Google or Apple id token
      description: |
        The app performs native sign-in and sends the provider id token; the
        backend verifies signature/issuer/audience/nonce and finds-or-creates
        the user keyed on (provider, subject), linking by verified email.
        Signing in during a pending account deletion cancels the deletion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider:
                  type: string
                  enum: [google, apple]
                idToken:
                  type: string
                nonce:
                  type: string
                  description: Raw nonce used in the native sign-in request, when the platform requires it.
                name:
                  type: string
                  maxLength: 100
                  description: >-
                    Apple only exposes the user's name to the app on first
                    authorization and it is absent from the id token — the app
                    passes it here on first sign-in. Can be absent even then;
                    the backend derives a placeholder from the email local-part
                    and the user sets their name in onboarding (PATCH /me).
      responses:
        "200":
          description: Session created (account created on first sign-in).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Id token failed verification.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      description: |
        Exchanges a valid refresh token for a new token pair. The old refresh
        token is revoked (single-use rotation). Reuse of a rotated token
        revokes the whole token family and returns 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Refresh token invalid, expired, revoked, or reused.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/sign-out:
    post:
      tags: [auth]
      summary: Sign out (revoke a refresh token)
      description: Revokes the given refresh token. Always 204, even if already revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "204":
          description: Revoked (idempotent).
        default: { $ref: "#/components/responses/Problem" }

  # ── Account / profile ───────────────────────────────────────────────────
  /me:
    get:
      tags: [account]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [account]
      summary: Update profile (name, units)
      description: '"Changes apply everywhere, right away" — units affect display only; stored values stay metric.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                units:
                  $ref: "#/components/schemas/Units"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  /me/vacations:
    # Vacation ranges (BE-025, D1). Stored as one encrypted opaque blob (per-user
    # DEK); the server never reads or interprets these dates — this is durability
    # for the device-local vacation config, which drives all vacation behaviour.
    get:
      tags: [account]
      summary: Get the stored vacation ranges
      description: The ranges as last written; an empty array if the user has never set any.
      responses:
        "200":
          description: Vacation ranges.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VacationRange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [account]
      summary: Replace the stored vacation ranges
      description: >-
        Replace-on-write: the whole array is re-encrypted and replaces the
        previous value. No merge, no server-side interpretation. Echoes what was
        stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/VacationRange" }
      responses:
        "200":
          description: The stored vacation ranges.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VacationRange" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  /me/settings:
    # 0.8.0 (BE-056). Durability for the device-local settings bundle — habit
    # definitions, composition flags ("what Vita keeps"), notification prefs,
    # recap hour, vacation prefs, plan provenance. Same posture as
    # /me/vacations: ONE opaque encrypted blob (per-user DEK, AAD
    # `user_settings.settings`) that the server stores verbatim and NEVER reads
    # or interprets. Scope is recovery-only, one device at a time (CEO Round 14
    # #8) — hence last-write-wins with no merge.
    get:
      tags: [account]
      summary: Get the stored settings blob
      description: >-
        The blob as last written; `{}` if the user has never written one.
        Clients MUST call this before their first PUT (see below).
      responses:
        "200":
          description: The stored blob, verbatim.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [account]
      summary: Replace the stored settings blob
      description: >-
        Replace-on-write, last-write-wins: the whole object is re-encrypted and
        replaces the previous value. No merge, no server-side interpretation,
        no schema — the only validation is "is a JSON object" and a ~64 KB size
        cap (larger → 400). Echoes what was stored.

        CLIENT RULE (hydrate before push): a fresh install MUST GET first and
        adopt what it finds (or observe an empty `{}`) before it is allowed to
        PUT — otherwise an empty local state would overwrite the stored blob
        and defeat the whole point. Because this is last-write-wins with no
        merge, two devices editing concurrently would lose one side's edits;
        that is accepted (recovery-only scope, CEO Round 14). If concurrent
        multi-device editing ever becomes real, habits split out as their own
        resource keyed on the stable ids they already carry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The stored blob.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Body is not a JSON object, or exceeds the ~64 KB size cap.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  /account:
    delete:
      tags: [account]
      summary: Request account deletion (7-day grace)
      description: |
        Starts the 7-day grace period (ADR-0004): account marked pending
        deletion, all refresh tokens revoked. Any successful sign-in during the
        window cancels the deletion. After 7 days: crypto-shred + hard delete.
        Idempotent — repeating the request does not move the date.
      responses:
        "202":
          description: Deletion scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [deletionEffectiveAt]
                properties:
                  deletionEffectiveAt:
                    type: string
                    format: date-time
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  # ── Log entries ─────────────────────────────────────────────────────────
  /entries:
    post:
      tags: [entries]
      summary: Create a log entry (user-confirmed)
      description: |
        The single write path to the log — AI drafts reach it only after the
        user confirms. Requires an Idempotency-Key: retrying the same key
        returns the original entry (200) instead of duplicating; the same key
        with a different body returns 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewEntry" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "200":
          description: Idempotent replay — the entry previously created with this key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Idempotency-Key was already used with a different request body.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [entries]
      summary: List entries (timeline)
      description: |
        Flat list ordered by occurredAt descending, cursor-paginated. Pass
        `date` for a single day (the Today screen); omit it and follow
        `nextCursor` for infinite scroll into the past. The app groups by day
        client-side (app review pt 2). No `?updatedSince=` delta sync in v0 —
        the app refreshes by day and infers deletes from omissions (app
        review pt 3; revisit with tombstones only if multi-device happens).

        0.4.0 (BE-017) adds two additive filters, both composable with `cursor`
        and `limit`:
          - `from`/`to` — an explicit half-open `[from, to)` occurredAt window
            (either bound optional) for trends/history bulk reads. Mutually
            exclusive with `date` (sending both is a 400).
          - `type` — a CSV allow-list of entry types. Home sends
            `type=meal,water,workout` (excludes check-ins); Habits sends
            `type=checkin`. `checkin` is accepted now and returns nothing until
            that entry type ships (BE-024).

        0.8.0: `weight` joins the `type` enum, and this endpoint gains a second
        role — it is the **restore read**. The log is persisted server-side and
        encrypted, but until 0.8.0 no client ever read it back, so a reinstall
        lost the whole log. The app now pages this endpoint backwards on a
        device with an empty local log (12-month window, background, silent —
        CEO Round 14) and inserts what it gets as already-synced rows. Nothing
        changes server-side; it is the same paging contract.
      parameters:
        - name: date
          in: query
          description: Local calendar day to fetch, interpreted with `tz`. Not combinable with from/to.
          schema:
            type: string
            format: date
        - name: tz
          in: query
          description: >-
            IANA timezone used to resolve `date` to a time range
            (e.g. Europe/Lisbon). Required when `date` is present.
          schema:
            type: string
        - name: from
          in: query
          description: Inclusive lower bound (occurredAt >=). Not combinable with `date`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive upper bound (occurredAt <). Not combinable with `date`.
          schema:
            type: string
            format: date-time
        - name: type
          in: query
          description: >-
            CSV allow-list of entry types to include. `checkin` is accepted
            forward-compatibly (BE-024) and matches nothing until then.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [meal, water, workout, checkin, weight]
        - name: cursor
          in: query
          description: Opaque cursor from a previous response.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
                  nextCursor:
                    type: string
                    description: Absent when there are no older entries.
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  /entries/{entryId}:
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [entries]
      summary: Get one entry (meal/workout detail screens)
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [entries]
      summary: Update an entry
      description: |
        Partial update. `type` is immutable; sending a `detail` replaces the
        whole detail object (no per-field merge inside it) and it must match
        the entry's type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                occurredAt:
                  type: string
                  format: date-time
                detail:
                  $ref: "#/components/schemas/EntryDetail"
      responses:
        "200":
          description: Updated entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [entries]
      summary: Delete an entry
      description: Hard delete — the log belongs to the user.
      responses:
        "204":
          description: Deleted (idempotent — deleting a missing entry also returns 204).
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  # ── AI parse (drafts only — never persisted server-side) ────────────────
  /parse/text:
    post:
      tags: [parse]
      summary: Parse natural language into draft entries
      description: |
        Stateless: text in, draft entries out — nothing is stored (ADR-0005).
        The app shows the confirmation card and, on Confirm, POSTs the
        (possibly adjusted) draft to /entries. All numeric values are
        estimates. Rate-limited per user per day (abuse guard). On timeout the
        app falls back to manual entry.

        0.8.0 — PLAN-AWARE. Request and response shapes are unchanged. When the
        user has a current eating plan, the server injects a compact digest of
        it (meal id/name/time → item id/name/quantity/unit/kcal-per-unit; swap
        lists deliberately excluded) into the prompt, so a phrase like "lunch as
        planned but I swapped the rice for sweet potato" comes back as the
        matched meal's FULL resulting composition: `detail.planMealId`,
        `detail.planStatus` ("done" when nothing differs, "adjusted"
        otherwise), `planOptionIndex` when an option was eaten, and every item
        tagged with `replacesItemId`. No plan, or nothing matches → identical
        behaviour to 0.7.0 (a free-form meal draft with no plan fields); the
        422 branch is unchanged. There is no separate "match it to my plan"
        call and no delta object — the app subtracts locally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: The transcript or typed phrase, verbatim.
                capturedAt:
                  type: string
                  format: date-time
                  description: >-
                    Device time (with offset) when the phrase was captured —
                    anchors relative phrases like "around 4".
      responses:
        "200":
          description: Draft entries — usually one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The text could not be interpreted as a meal, water, or workout.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /parse/photo:
    post:
      tags: [parse]
      summary: Parse a photo (plate or gym whiteboard) into draft entries
      description: |
        Stateless like /parse/text — the image is sent to the model and
        discarded, never stored. A plate photo yields a meal draft; a
        whiteboard photo yields a workout draft.

        Multipart confirmed by app review (pt 4). The app downscales
        client-side to longest edge 1568 px, JPEG quality 0.8, before upload;
        the 5 MB limit is a server-side backstop only.

        0.8.0 — PLAN-AWARE, exactly as /parse/text: same request and response
        shapes, the plan digest is injected when the user has a current eating
        plan, and a photo that matches a plan meal comes back with
        `planMealId` / `planStatus` / `planOptionIndex` and per-item
        `replacesItemId`. No plan or no match → 0.7.0 behaviour verbatim.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG/PNG/WebP, max 5 MB.
                caption:
                  type: string
                  maxLength: 500
                  description: Optional user hint spoken/typed with the photo.
                capturedAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Draft entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Image too large.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Nothing recognizable (no food, no workout) in the image.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /parse/eating-plan:
    post:
      tags: [parse]
      summary: Start an eating-plan import (async parse; saves as status "review")
      description: |
        v3 (0.7.0, BREAKING vs 0.6.0): a full plan parse (options + complete
        substitution lists) takes minutes — far beyond the API Gateway 29 s
        ceiling — so this endpoint now ACCEPTS the import and parses in the
        background. On success the parsed plan is SAVED as the user's current
        eating-plan version with status "review" (new version: overlay resets,
        ids assigned — the imported-but-unreviewed state is persistent, per
        the v3 design). Poll GET /parse/eating-plan/jobs/{jobId}; when state
        is "done", GET /plan. Body unchanged (exactly one of text | fileRef).
        Nothing about the uploaded PDF is persisted beyond the parse
        (ADR-0005); only the structured result is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanImportRequest" }
      responses:
        "202":
          description: Import accepted; parse running.
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId: { type: string, format: uuid }
        "400":
          description: Not exactly one of text/fileRef, or text over 8000 chars.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: An import is already running for this user (detail carries its jobId).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /parse/eating-plan/jobs/{jobId}:
    get:
      tags: [parse]
      summary: Poll an eating-plan import job
      description: |
        States: "running" → keep polling (suggested every 2–3 s; a job older
        than 10 minutes is reported failed); "done" → the plan was saved with
        status "review", fetch GET /plan; "failed" → failureReason is a short
        human-safe sentence (unreadable document, not an eating plan, upstream
        error) — the app offers retry / manual entry. Jobs are visible to
        their owner only (404 otherwise) and are swept after 7 days.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [running, done, failed] }
                  failureReason: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /parse/training-program:
    post:
      tags: [parse]
      summary: Parse a training program (text or PDF) into a draft for confirmation
      description: |
        Onboarding step 4 ("training program"). Stateless like
        /parse/eating-plan — structured draft plus human-readable summary,
        confirmed before anything is saved (ADR-0005). Durations and loads are
        estimates or as-stated. On Confirm the app POSTs the draft to the
        program-create endpoint (a later ticket).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanImportRequest" }
      responses:
        "200":
          description: Draft training program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingProgramDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >-
            The input could not be interpreted as a training program, or the
            `fileRef` is unknown/expired.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # ── Uploads (presigned; bytes never pass through the API) ────────────────
  /uploads:
    post:
      tags: [uploads]
      summary: Request a presigned URL to upload a document
      description: |
        Two-phase upload for payloads that must not pass through the JSON body:
        API Gateway caps requests at 10 MB (OPS-011), and the parse pattern
        does not proxy file bytes. The app requests a short-lived presigned PUT
        URL, uploads the file straight to S3, then references the returned
        opaque `fileRef` on a parse call (e.g. /parse/eating-plan). The backend
        reads the object server-side for that one call and never persists it
        beyond the parse (ADR-0005); the bucket expires objects automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType]
              properties:
                purpose:
                  type: string
                  enum: [plan_document]
                  description: What the upload feeds. v0 only supports plan/program import.
                contentType:
                  type: string
                  enum: [application/pdf]
                  description: MIME type of the file; the PUT must send the same Content-Type.
      responses:
        "200":
          description: Presigned upload target.
          content:
            application/json:
              schema:
                type: object
                required: [fileRef, uploadUrl, expiresAt]
                properties:
                  fileRef:
                    type: string
                    description: Opaque handle to pass to a parse endpoint after the PUT succeeds.
                  uploadUrl:
                    type: string
                    format: uri
                    description: Presigned S3 PUT URL (single use). Upload the bytes with the same Content-Type.
                  expiresAt:
                    type: string
                    format: date-time
                    description: After this the URL and fileRef are void.
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  # ── Persisted eating plan & training program (versioned, editable) ───────
  # The confirmed parse draft is stored as-is, encrypted (per-user DEK, ADR-0003).
  # POST = import a new version (history capped, oldest dropped); GET = current;
  # PUT = edit current (full-doc replace + re-encrypt — no server-side merge);
  # GET …/history = the past versions (frozen; no restore in v0). BE-019/BE-020.
  /plan:
    get:
      tags: [plans]
      summary: Get the current eating plan
      description: >-
        The newest stored version, for the Home plan row and the Eating Plan
        screen. Since 0.6.0 the response may additionally carry the sparse
        `portions` override map (see PortionsMap) — additive, old clients
        ignore it. POST/PUT echoes and history versions never carry it.
      responses:
        "200":
          description: The current eating plan (plus optional portion overlay).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EatingPlanWithPortions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [plans]
      summary: Import (store) an eating plan as a new version
      description: |
        Persists a confirmed plan draft as a new version. History is capped at a
        server limit (default 5); importing beyond it drops the oldest version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EatingPlanDraft" }
      responses:
        "201":
          description: Stored eating plan (the new current version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EatingPlanDraft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [plans]
      summary: Edit the current eating plan
      description: |
        Full-doc replace of the current version — any field is editable. The
        whole document is re-encrypted server-side; there is no per-field merge.
        Does not create a new version (past versions are frozen).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EatingPlanDraft" }
      responses:
        "200":
          description: The edited eating plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EatingPlanDraft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /plan/portions:
    put:
      tags: [plans]
      summary: Replace the eating-plan portion overlay
      description: |
        Full replace of the sparse portion-override map for the CURRENT
        eating-plan version. Idempotent — the map is small, there is no
        incremental PATCH; offline clients drain last-write-wins. Values are
        clamped server-side to the item's `portion` bounds and snapped to its
        step; the response echoes the map as stored. Every key must be an item
        id of the current plan version — any unknown id rejects the whole
        request with 422 (the app should refetch GET /plan and resubmit). An
        empty map clears the overlay. Portion changes never create plan
        versions; the overlay resets when a new version is imported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortionsMap" }
      responses:
        "200":
          description: The overlay as stored (after clamping).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortionsMap" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No current eating plan exists.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: One or more keys are not item ids of the current plan version.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }

  /plan/history:
    get:
      tags: [plans]
      summary: List stored eating-plan versions
      description: The past versions (newest first), capped at the server limit. Frozen — display only.
      responses:
        "200":
          description: Stored eating-plan versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlanVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  /program:
    get:
      tags: [plans]
      summary: Get the current training program
      description: The newest stored version, for the Home program row and the program screen.
      responses:
        "200":
          description: The current training program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingProgramDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [plans]
      summary: Import (store) a training program as a new version
      description: |
        Persists a confirmed program draft as a new version. History is capped at
        a server limit (default 5); importing beyond it drops the oldest version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingProgramDraft" }
      responses:
        "201":
          description: Stored training program (the new current version).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingProgramDraft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [plans]
      summary: Edit the current training program
      description: |
        Full-doc replace of the current version — any field is editable. The
        whole document is re-encrypted server-side; there is no per-field merge.
        Does not create a new version (past versions are frozen).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrainingProgramDraft" }
      responses:
        "200":
          description: The edited training program.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingProgramDraft" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /program/history:
    get:
      tags: [plans]
      summary: List stored training-program versions
      description: The past versions (newest first), capped at the server limit. Frozen — display only.
      responses:
        "200":
          description: Stored training-program versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgramVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  # ── Public pages ────────────────────────────────────────────────────────
  /privacy:
    get:
      tags: [public]
      summary: Privacy policy (public HTML page)
      description: |
        0.8.0 (BE-055). The store listings and the account screen need a public
        privacy-policy URL. No domain is being bought (CEO Round 13, cheapest
        option), so the page is served by this API under the same `/v1` base
        path every other public route uses — the deployed URL is
        `<publicBaseUrl>/v1/privacy`, exactly the `/v1/auth/link` pattern
        (BE-035). Static HTML, no auth, no query parameters, no state, nothing
        logged beyond the ordinary access log. Never called by the app; a human
        or a store reviewer opens it in a browser. If a domain is bought later
        the URL changes and this route stays as the origin.
      security: []
      responses:
        "200":
          description: The privacy policy page.
          content:
            text/html:
              schema:
                type: string
        default: { $ref: "#/components/responses/Problem" }

  # ── Estimation (0.9.0 — the "fill it in for me" passes) ─────────────────
  /estimate/food-kcal:
    post:
      tags: [estimate]
      summary: Estimate kcal for a list of plan items
      description: |
        0.9.0 (D7). Stateless, like /parse/* — items in, numbers out; nothing
        about the user is stored (ADR-0005, ADR-0020). Backs the manual eating
        plan builder's "Fill in the calories for me".

        Every number returned is an ESTIMATE, never a target. The caller marks
        each value it accepts with `PlanItem.kcalEstimated: true` so the label
        survives into the saved plan.

        Lookup order per item (ADR-0020): normalized exact match on the seeded
        food table → alias → trigram fuzzy match → estimate cache → the model,
        for misses only and in ONE batched call for the whole pass. A pass that
        the table answers in full makes no outbound call at all and returns in
        milliseconds. Model answers are cached (user-less, see ADR-0020) so a
        given name is a miss exactly once.

        Rounding is server-side, on table hits and model answers alike:
        `max(5, round(k/5)*5)`. A `237` would suggest a precision the estimate
        does not have, so the boundary launders it into a `235`.

        Synchronous — the worst realistic pass (60 fresh misses) is well inside
        the gateway ceiling. One call counts against the same per-user daily
        parse quota as /parse/text; there is no separate limiter and no
        idempotency key (the endpoint writes no user data).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 60
                  description: >-
                    The items to price, in the caller's own order. 0 or more
                    than 60 → 400; a longer plan is two passes behind the same
                    progress box. The app sends ONLY the items whose kcal is
                    still empty — a number the user typed is never sent and
                    therefore can never be overwritten.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 100
                        description: As typed ("Pão francês", "Aveia").
                      quantity:
                        type: number
                        minimum: 0
                      unit:
                        type: string
                        maxLength: 20
                        description: >-
                          "g" / "ml" / "unit" / "serving". A count-unit
                          resolves from the table only when the matched food
                          knows its grams-per-unit; otherwise it is a miss and
                          the model answers, which is what keeps one unit of
                          bread and one unit of watermelon apart.
      responses:
        "200":
          description: >-
            Positional results — same length and same order as the request,
            always. An item nothing could answer comes back `{"kcal": null}`
            and the caller leaves its dash; the array is never shifted or
            filtered. Partial by design: if the model leg fails while the
            table answered some items, this is still a 200 with nulls for the
            rest — an estimate pass never puts the user's plan at risk.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kcal:
                          type: [integer, "null"]
                          minimum: 5
                          description: >-
                            Total kcal for the item at its stated quantity —
                            the value for PlanItem.kcal. Integer, multiple of
                            5, floor 5. Null = no answer (leave the field
                            empty; do NOT substitute a zero).
        "400":
          description: Empty item list, or more than 60 items.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >-
            Nothing could be estimated — the model leg failed AND the table
            answered nothing, so the response would be all nulls. Same
            semantics as /parse/text's 422; the plan is untouched either way.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /estimate/exercise-muscles:
    post:
      tags: [estimate]
      summary: Estimate which muscles an exercise works
      description: |
        0.9.0 (D8). Stateless, same lookup order, same cache policy and same
        quota as /estimate/food-kcal, over the seeded exercise catalog instead
        of the food table. Backs the training builder: a free-typed exercise
        stops reading "not mapped" without pretending to catalog confidence.

        The answer is an estimate of a body map, not a measurement. When the
        model is not confident the response is an EMPTY muscleRoles list and
        the app keeps "not mapped" — guessing would invent data. Names that
        come back are normalized onto the closed muscle vocabulary before they
        leave (and before they reach the cache); anything unmappable is
        dropped rather than approximated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 60
                  description: Exercise names as typed. 0 or >60 → 400.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
      responses:
        "200":
          description: Positional results — same length, same order as `names`.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [muscleRoles, wholeBody, estimated]
                      properties:
                        muscleRoles:
                          type: array
                          description: >-
                            Exactly the shape of Exercise.muscleRoles, ready
                            to copy onto the exercise. EMPTY when nothing was
                            matched and nothing was confidently guessed — the
                            honest answer, rendered as "not mapped".
                          items:
                            type: object
                            required: [name, role]
                            properties:
                              name:
                                type: string
                                enum:
                                  - chest
                                  - back
                                  - shoulders
                                  - biceps
                                  - triceps
                                  - forearms
                                  - core
                                  - glutes
                                  - quads
                                  - hamstrings
                                  - calves
                                  - traps
                              role:
                                type: string
                                enum: [primary, secondary]
                        wholeBody:
                          type: boolean
                          description: >-
                            The value for Exercise.wholeBody — "the split is a
                            guess" (muay thai, swimming).
                        estimated:
                          type: boolean
                          description: >-
                            True = nobody curated this mapping; the model
                            guessed it. The app must paint an estimated
                            mapping in the PALE band, never the full tone a
                            catalog entry gets: an estimate stays labeled as
                            an estimate. False = it came from the curated
                            catalog. The flag does not reach the saved
                            program document — the app folds it into the
                            existing pale/soft rendering flag before saving.
        "400":
          description: Empty name list, or more than 60 names.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >-
            Nothing could be estimated (model leg failed with zero catalog
            hits). Same semantics as /estimate/food-kcal.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /estimate/workout-kcal:
    post:
      tags: [estimate]
      summary: Estimate the energy of one hand-built training day
      description: |
        0.9.0 (D9 — CEO Round 16). A hand-built training day keeps its
        `~kcal` line, typed by the user or estimated here, and the answer
        feeds the EXISTING `ProgramDay.kcalEstimate` — no schema change to the
        program document.

        One day per call: the whole day's exercises go in, one number comes
        out, because energy is a property of the session, not a sum of
        independent rows. The estimate is built from the catalog's metadata
        for the exercises it recognizes (family, whole-body) plus the volume
        the caller states; the model is asked only about what the catalog
        misses. Same quota, same cache policy, same server-side multiple-of-5
        rounding as /estimate/food-kcal.

        The response is always flagged `estimated: true` — this endpoint has
        no other kind of answer. It is a rough energy figure for a plan the
        user wrote, not a goal, not a budget, and nothing in Vita compares it
        to anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exercises]
              properties:
                exercises:
                  type: array
                  minItems: 1
                  maxItems: 60
                  description: The day's exercises. 0 or >60 → 400.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 100
                      fam:
                        type: string
                        enum: [set, time]
                        description: >-
                          Which family the row is measured in — `set` reads
                          sets/reps, `time` reads min. Absent → derived from
                          whichever fields are present.
                      sets:
                        type: integer
                        minimum: 1
                      reps:
                        type: integer
                        minimum: 1
                      min:
                        type: integer
                        minimum: 1
                        description: Minutes, for the time family.
      responses:
        "200":
          description: The day's energy estimate.
          content:
            application/json:
              schema:
                type: object
                required: [kcal, estimated]
                properties:
                  kcal:
                    type: integer
                    minimum: 5
                    description: >-
                      Whole-day estimate for ProgramDay.kcalEstimate. Integer,
                      multiple of 5, floor 5 — rounded server-side for the
                      same reason as food kcal.
                  estimated:
                    type: boolean
                    description: >-
                      Always true. Present so the value can never travel
                      without its label, and so a caller reading only the
                      payload cannot mistake it for a measurement.
        "400":
          description: Empty exercise list, or more than 60 exercises.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Nothing usable to estimate from (no recognizable exercise, model leg failed).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated key, unique per logical create, reused on retries.
        Usually a UUID; for naturally-idempotent domains it is deterministic —
        check-ins use `habitId:date` so a habit can be checked in once per day
        (BE-024).
      schema:
        type: string

  responses:
    Problem:
      description: Error (RFC 7807).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, expired, or invalid access token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource does not exist or belongs to another user.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit exceeded. Retry after the indicated delay.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details. `detail` is developer-facing English; the app owns user-facing copy (ADR-0006).
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT, ~15 min lifetime.
        refreshToken:
          type: string
          description: Opaque, single-use (rotated on refresh), 60-day lifetime.
        expiresIn:
          type: integer
          description: Access-token lifetime in seconds.

    Units:
      type: string
      enum: [metric, imperial]

    User:
      type: object
      required: [id, name, email, units, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        units:
          $ref: "#/components/schemas/Units"
        createdAt:
          type: string
          format: date-time
        deletionEffectiveAt:
          type: string
          format: date-time
          description: Present only while an account deletion is pending (7-day grace).

    VacationRange:
      type: object
      description: >-
        One vacation date range (BE-025). The array of these is stored server-side
        as a single encrypted opaque blob (per-user DEK); the server never reads
        or interprets it — the device drives all vacation behaviour (D1).
      required: [start, end]
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    InputMethod:
      type: string
      enum: [voice, text, photo, tap, checkin, import]
      description: checkin and import appear from W5/W6 onward; the app only sends the first four in v0.

    EntrySource:
      type: string
      enum: [user, apple_health, health_connect]
      description: Server-set. /entries creates are always `user`; health ingestion (W6, separate contract) writes the others.

    NewEntry:
      type: object
      description: >-
        Create payload for /entries — also exactly the draft shape returned by
        the parse endpoints, so a confirmed draft is POSTed as-is.
      required: [type, occurredAt, inputMethod, detail]
      properties:
        type:
          type: string
          enum: [meal, water, workout, checkin, weight]
          description: >-
            `checkin` (BE-024) rides this same write path as a habit check-in
            result; Home reads exclude it, Habits reads select it (see GET
            /entries `type`). `weight` (0.8.0) is a manually logged body-weight
            reading — see WeightDetail.
        occurredAt:
          type: string
          format: date-time
          description: When it happened (user-adjustable), with offset.
        inputMethod:
          $ref: "#/components/schemas/InputMethod"
        sourcePhrase:
          type: string
          maxLength: 2000
          description: The user's original words, quoted on the detail screen ("logged by voice").
        isEstimate:
          type: boolean
          default: false
          description: True for AI-derived numbers — drives the "Estimated by Vita" label.
        detail:
          $ref: "#/components/schemas/EntryDetail"

    LogEntry:
      allOf:
        - $ref: "#/components/schemas/NewEntry"
        - type: object
          required: [id, source, loggedAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            source:
              $ref: "#/components/schemas/EntrySource"
            loggedAt:
              type: string
              format: date-time
              description: Server receive time.
            updatedAt:
              type: string
              format: date-time
              description: Bumped on every change — the app's offline-sync freshness marker.

    EntryDetail:
      description: Typed payload; discriminated by the sibling `type` field on the entry.
      oneOf:
        - $ref: "#/components/schemas/MealDetail"
        - $ref: "#/components/schemas/WaterDetail"
        - $ref: "#/components/schemas/WorkoutDetail"
        - $ref: "#/components/schemas/CheckinDetail"
        - $ref: "#/components/schemas/WeightDetail"

    MealDetail:
      type: object
      required: [items]
      properties:
        title:
          type: string
          maxLength: 100
          description: Short display title, e.g. "Banana & peanuts".
        items:
          type: array
          minItems: 0
          items: { $ref: "#/components/schemas/MealItem" }
          description: >-
            0.8.0: may be EMPTY, but only when `planStatus` is "skipped" — a
            skipped plan meal is a real record of "I did not have this", with
            zero totals. Empty items with any other status is a 400. Every
            client summing `items` must therefore tolerate an empty array and
            an all-zero `totals`.
        totals:
          $ref: "#/components/schemas/MacroTotals"

        # ── 0.8.0 (v4 day record) ────────────────────────────────────────
        planMealId:
          type: string
          maxLength: 40
          description: >-
            The PlanMeal.id ("m-1"…"m-N") this record fulfils. Absent for a
            free-form meal that isn't in the plan (the 0.7.0 behaviour). The
            record stays self-describing (title/items/totals) so it renders
            correctly after the plan is re-imported and this id goes stale —
            the server never validates it against the current plan (a retro
            record may legitimately outlive the plan version it points at).
        planStatus:
          type: string
          enum: [done, adjusted, skipped]
          description: >-
            The day-record status for this plan meal. "done" = eaten as
            planned; "adjusted" = eaten with swaps/portion changes/omissions;
            "skipped" = the user recorded not having it. There is NO "planned"
            value — a plan meal with no record is, by definition, unrecorded.
            Requires planMealId (sending it alone is a 400).
        planOptionIndex:
          type: integer
          minimum: 0
          description: >-
            Which MealOption of the plan meal was eaten (index into
            PlanMeal.options); absent = the meal's own `items`. Requires
            planMealId (sending it alone is a 400).

    MealItem:
      type: object
      required: [name, kcal]
      properties:
        name:
          type: string
          maxLength: 100
        quantity:
          type: number
        unit:
          type: string
          maxLength: 20
          description: Free-form ("g", "ml", "handful", "slice"). Display verbatim.
        kcal:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0
        micros:
          type: array
          items: { $ref: "#/components/schemas/Micro" }
        replacesItemId:
          type: string
          maxLength: 40
          description: >-
            0.8.0. The PlanItem.id this item stands in for. Set by the
            plan-aware parse and by the app when the user swaps or re-portions
            a planned item, so the day record can render
            "White rice · 150g → Sweet potato · 200g · −23 kcal". An UNCHANGED
            planned item carries its own id here (a matched meal returns its
            full resulting composition, every item tagged). Absent for an item
            that isn't in the plan at all. Server-opaque — the kcal delta is
            computed client-side from the plan item and this item, never on the
            wire.

    Micro:
      type: object
      required: [name, amount, unit]
      properties:
        name:
          type: string
          maxLength: 50
          description: >-
            Free-form name (e.g. "Vitamin C", "Iron") — the app renders it
            verbatim (app review pt 7).
        amount:
          type: number
          minimum: 0
        unit:
          type: string
          maxLength: 10
          description: mg, µg, g…
        percentDaily:
          type: number
          minimum: 0
          description: Percent of the FDA Daily Value (ADR-0009). Estimate.

    MacroTotals:
      type: object
      description: Denormalized totals for cards/aggregation. Server recomputes from items on write; clients treat as read-mostly.
      required: [kcal]
      properties:
        kcal:
          type: number
          minimum: 0
        proteinG:
          type: number
          minimum: 0
        carbsG:
          type: number
          minimum: 0
        fatG:
          type: number
          minimum: 0

    WaterDetail:
      type: object
      required: [amountMl]
      properties:
        amountMl:
          type: integer
          minimum: 1
          maximum: 10000
          description: Always milliliters on the wire; the app converts for imperial display.

    WorkoutDetail:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 100
        durationMin:
          type: integer
          minimum: 1
        kcal:
          type: number
          minimum: 0
          description: Energy estimate.
        muscles:
          type: array
          items:
            type: string
            enum:
              - chest
              - back
              - shoulders
              - biceps
              - triceps
              - forearms
              - core
              - glutes
              - quads
              - hamstrings
              - calves
              - traps
          description: >-
            Closed vocabulary — exactly the 12 silhouettes the body-map UI
            supports (app review pt 6). Backend maps model output onto this
            list and drops anything unmappable ("lats" → back,
            "abs"/"obliques" → core).
            0.9.0 adds `traps`: it used to fold into `back`, which silently
            deleted a distinction the app has a chip and a silhouette for
            (face pull, deadlift). Clients that predate 0.9.0 simply never
            see the value.
        exercises:
          type: array
          items: { $ref: "#/components/schemas/Exercise" }

        # ── 0.8.0 (v4 day record) ────────────────────────────────────────
        planDay:
          type: string
          maxLength: 100
          description: >-
            The ProgramDay.name this session fulfils ("Leg day"). Absent for an
            off-program workout. Programs have no stable day ids, so the name
            is the pointer — same staleness caveat as MealDetail.planMealId.
        planStatus:
          type: string
          enum: [done, adjusted, skipped]
          description: >-
            Same semantics as MealDetail.planStatus ("adjusted" covers a
            session done with exercises dropped or changed; the per-exercise
            detail already rides `exercises`). Requires planDay.

    Exercise:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        sets:
          type: integer
          minimum: 1
        reps:
          type: integer
          minimum: 1
        loadKg:
          type: number
          minimum: 0
          description: Always kg on the wire; the app converts for imperial display.

        # ── 0.9.0 (manual training builder) ──────────────────────────────
        durationMin:
          type: integer
          minimum: 1
          description: >-
            0.9.0. Minutes, for exercises measured in TIME rather than
            sets/reps (a 30-minute muay thai round, a 20-minute row). The
            set/time "family" is derived, not stored: `durationMin` present =
            the time family, `sets`/`reps` present = the set family. The
            builder keeps every field the user typed locally so switching
            family loses nothing, but only the active family's fields go on
            the wire.
        wholeBody:
          type: boolean
          description: >-
            0.9.0. "Whole body — the split is a guess." Set when the exercise
            works the body broadly enough that naming primaries would invent
            precision (muay thai, swimming, football). The app paints the
            body map in its pale band instead of the full tone: an honest
            estimate rendered as an estimate, never a measurement. Absent or
            false = the muscleRoles stand as given.
        muscles:
          type: array
          items:
            type: string
            enum:
              - chest
              - back
              - shoulders
              - biceps
              - triceps
              - forearms
              - core
              - glutes
              - quads
              - hamstrings
              - calves
              - traps
          description: >-
            Same closed vocabulary as WorkoutDetail.muscles, but per exercise —
            drives per-exercise muscle tinting in the app (0.5.0). Optional; the
            backend maps model output onto this list and drops anything
            unmappable. The workout-level `muscles` stays for back-compat.
        muscleRoles:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name:
                type: string
                enum:
                  - chest
                  - back
                  - shoulders
                  - biceps
                  - triceps
                  - forearms
                  - core
                  - glutes
                  - quads
                  - hamstrings
                  - calves
                  - traps
              role:
                type: string
                enum: [primary, secondary]
          description: >-
            Same closed 12-silhouette vocabulary as `muscles`, with each
            muscle's role in THIS exercise. Feeds the body-map opacities and
            the PRIMARY/SECONDARY banner tag (design handoff §2.2). Optional.
            When present and `muscles` is absent, the backend derives `muscles`
            from the role names; roles are never derived from a bare
            `muscles` list. Backend maps model output onto the vocabulary
            (lats → back, abs/obliques → core; `traps` is its own value from
            0.9.0) and drops unmappables. 0.9.0 also runs POST/PUT /program
            through the same normalizer, not just the parse path — a
            hand-built program cannot store a muscle name off the vocabulary.

    CheckinDetail:
      type: object
      description: >-
        A single habit check-in result (BE-024). Rides the /entries write path
        as a `checkin` entry and is encrypted at rest like every other detail;
        the server stores it verbatim and never interprets it. The
        Idempotency-Key is deterministic — `habitId:date` — so there is one
        check-in per habit per day; change the answer by PATCHing the entry
        (same key + a different answer is a 409). No scores, no streaks.
      required: [habitId, habitName, kind, answer]
      properties:
        habitId:
          type: string
          maxLength: 100
          description: Device-local habit id — habit definitions live on the device (D1).
        habitName:
          type: string
          maxLength: 100
        kind:
          type: string
          maxLength: 40
          description: App-defined habit kind (e.g. plan-meal vs plain yes/no). Server-opaque.
        answer:
          type: string
          maxLength: 40
          description: The user's single answer, e.g. "yes" / "not_quite". App-defined.
        note:
          type: string
          maxLength: 500

    WeightDetail:
      type: object
      description: >-
        0.8.0. One manually logged body-weight reading. Health-Connect readings
        are NOT sent here — they stay device-local (ADR-0016 stands, CEO Round
        14 #5); this endpoint only ever receives a value the user typed, which
        is why LogEntry.source stays "user". The Trends weight line therefore
        mixes two sources by design: typed readings survive a reinstall,
        Health-Connect ones re-sync from the device. Encrypted at rest in the
        entry detail like every other type. No goal, no delta, no judgement — a
        reading and its time. Idempotency is the app's choice:
        `weight:<date>` gives one reading per day (PATCH corrects it, same
        pattern as check-ins); a plain uuid allows several. The server imposes
        neither.
      required: [kg]
      properties:
        kg:
          type: number
          minimum: 20
          maximum: 500
          description: Always kilograms on the wire (metric-only, APP-071). Outside the range → 400.

    ParseResult:
      type: object
      description: Never persisted server-side — response only (ADR-0005).
      required: [drafts]
      properties:
        drafts:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/NewEntry" }
          description: >-
            Usually one. A phrase like "had a sandwich and a big glass of
            water" yields two (meal + water). Capped at 5 so the app's
            stacked confirmation cards stay bounded (app review pt 5); the
            model merges or drops beyond that.

    PlanImportRequest:
      type: object
      description: >-
        Provide the plan either as free text (described/pasted) or as a
        reference to a PDF uploaded via POST /uploads. Exactly one of `text`
        or `fileRef`.
      oneOf:
        - required: [text]
        - required: [fileRef]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
          description: The plan or program described or pasted as text.
        fileRef:
          type: string
          description: >-
            `fileRef` from POST /uploads, pointing at an uploaded
            nutritionist/coach PDF.

    Hydration:
      type: object
      required: [mlPerDay]
      properties:
        mlPerDay:
          type: number
          minimum: 0
          description: Daily water target stated by the plan (e.g. 2500).
        note:
          type: string
          maxLength: 500
          description: How the plan says to spread it, transcribed.

    Supplement:
      type: object
      required: [name]
      description: >-
        A supplement prescription transcribed from the plan ("SUPLEMENTAÇÃO").
        Water is hydration, never a supplement. All fields are transcription
        in the document's language; the app turns accepted ones into local
        habits on "Finish setup" (device-side — the backend stores no habits).
      properties:
        name: { type: string, maxLength: 100 }
        dose:
          type: string
          maxLength: 100
          description: As stated, e.g. "1 dose (4g)", "1 cápsula 1g".
        timing:
          type: string
          maxLength: 200
          description: As stated, e.g. "ao dia, junto ao almoço ou jantar".
        duration:
          type: string
          maxLength: 100
          description: As stated, e.g. "5 meses". Absent when open-ended.

    MealOption:
      type: object
      required: [name, items]
      description: >-
        An alternative complete composition for a meal ("Opção 2 – Brunch").
        The meal's own `items` are the default composition; each option
        replaces them wholesale when chosen. Option items are full PlanItems:
        they get server ids, portion bounds and swap lists like base items.
      properties:
        name: { type: string, maxLength: 100 }
        kcal:
          type: number
          minimum: 0
          description: Stated per-option kcal from the report page when present, else estimate.
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanItem" }

    SwapOption:
      type: object
      required: [name]
      description: >-
        One entry of an item's substitution list ("Opções de substituição
        para …"), transcribed with its stated quantity. Swaps carry NO
        nutrition: a substitution at its stated quantity is treated as
        equivalent to the original item's total (that is what a nutritionist
        substitution list means) — the app derives a chosen swap's per-unit
        macros as base.nutritionPerUnit × base.quantity / swap.quantity,
        labeled an estimate. "À vontade" (as much as you like) entries have
        no quantity and unit "à vontade"; portion adjust is unavailable for
        them (no bounds).
      properties:
        name: { type: string, maxLength: 150 }
        quantity: { type: number }
        unit:
          type: string
          maxLength: 40
          description: Free-form, display verbatim ("Fatia(s) média(s)", "à vontade").
        grams:
          type: number
          minimum: 0
          description: Gram/ml equivalent when stated in parentheses ("2 Fatias (150g)" → 150).

    EatingPlanDraft:
      type: object
      description: >-
        Never persisted server-side — response only (ADR-0005). Shaped so the
        confirmed draft is POSTed as-is to the plan-create endpoint (later
        ticket). All nutrition is estimate.
      required: [summary, meals]
      properties:
        summary:
          type: string
          maxLength: 1000
          description: >-
            Human-readable read-back shown for confirmation ("AI reads back a
            plan summary").
        dailyTotals:
          allOf: [ { $ref: "#/components/schemas/MacroTotals" } ]
          description: >-
            Daily totals. When the document contains a nutrient report page
            (e.g. "Relatório de nutrientes"), these are its STATED totals
            copied verbatim (transcription, not estimation); otherwise a model
            estimate. Same rule applies to per-meal/option kcal and `micros`.
        micros:
          type: array
          items: { $ref: "#/components/schemas/Micro" }
          description: Daily micronutrient chips (estimates) for the Eating Plan screen.
        meals:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PlanMeal" }
        status:
          type: string
          enum: [ready, review]
          description: >-
            Plan lifecycle (v3): "review" = imported but not yet reviewed (the
            async parse saves with this; drives the Home "finish setup" banner
            and Today's-plan review state); "ready" = reviewed/active. Absent
            (docs saved before 0.7.0) reads as "ready". "none" is not a value —
            it is GET /plan returning 404. The app flips review→ready by
            PUTting the doc with status "ready" ("Finish setup").
        note:
          type: string
          maxLength: 1000
          description: >-
            Plan-level nutritionist guidance transcribed from the document
            (e.g. "up to 2 meals a week may go off-plan; plan valid for up to
            6 months"). Display-only, in the document's own language.
        hydration:
          $ref: "#/components/schemas/Hydration"
        supplements:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Supplement" }

    PlanMeal:
      type: object
      required: [name, items]
      properties:
        id:
          type: string
          maxLength: 40
          description: >-
            0.8.0. Server-generated stable meal id ("m-1"…"m-N" in document
            order), assigned when a plan version is saved — exactly the
            PlanItem.id rules: clients MUST round-trip it unchanged on
            PUT /plan, POST assigns fresh ones, duplicates are a 400, and there
            is NO backfill. Docs saved before 0.8.0 read back id-less and need
            one re-save or re-import before day records can point at them (the
            CEO re-imports the plan once after the v4 deploy). Absent on parse
            responses. This is the target of MealDetail.planMealId.
        name:
          type: string
          maxLength: 100
          description: Meal slot label, e.g. "Breakfast", "Lunch", "Snack", "Dinner".
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local time-of-day (HH:MM) the plan suggests, when it states one.
        items:
          type: array
          minItems: 0
          description: >-
            0.9.0 relaxes this from minItems 1: a named slot with no food in
            it yet is a legitimate plan meal (the manual builder lets you add
            "Supper" before you decide what goes in it), exactly as 0.8.0
            relaxed MealDetail.items for a skipped meal.
          items: { $ref: "#/components/schemas/PlanItem" }
        kcal:
          type: number
          minimum: 0
          description: >-
            Per-meal kcal for the DEFAULT composition — stated report-page
            value when present ("Almoço … 702 Kcal"), else estimate.
        note:
          type: string
          maxLength: 1000
          description: The meal's "Observações", transcribed.
        options:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/MealOption" }
        usualOptionIndex:
          type: integer
          minimum: 0
          description: >-
            The user's usual composition: absent/null = the meal's own
            `items`; k = options[k]. Set by the app via PUT /plan (plan
            setup / "pick your usual"). Out of range on PUT → 400.

    PlanItem:
      type: object
      required: [name]
      properties:
        id:
          type: string
          maxLength: 40
          description: >-
            Server-generated stable item id ("it-1"…"it-N" in document order),
            assigned when a plan version is saved; the key of the portions
            overlay. Clients MUST round-trip it unchanged on PUT /plan. Absent
            on parse responses and on docs saved before 0.6.0 (no backfill —
            such docs have no usable overlay until their next save assigns ids).
        name:
          type: string
          maxLength: 100
        quantity:
          type: number
        unit:
          type: string
          maxLength: 20
          description: Free-form ("g", "ml", "slice"). Display verbatim.

        # ── 0.9.0 (manual eating-plan builder) ───────────────────────────
        kcal:
          type: number
          minimum: 0
          description: >-
            0.9.0. TOTAL kcal for this item at its stated `quantity` — NOT per
            unit (that is `nutritionPerUnit`, which is unchanged and
            independent). 60 g of oats is one `kcal: 235`, not 3.9 × 60. An
            integer, and a multiple of 5 whenever it came from the estimate
            pass: the server rounds on the way out of /estimate/food-kcal
            because a `237` claims a precision no estimate has. A number the
            user typed is stored verbatim. This is an estimate of what the
            plan suggests, never a target — Vita has no goals and no scores.
        kcalEstimated:
          type: boolean
          description: >-
            0.9.0. True when `kcal` came from the estimate pass rather than
            from the user or the source document; the app renders it as
            `~235` with a dashed underline wherever it appears. The flag
            travels WITH the number and persists in the saved plan — the
            constitution requires estimates to stay labeled as estimates for
            as long as they are shown, not just on the screen that produced
            them. Sending `kcalEstimated` without `kcal` is a 400: there is
            no estimate to label.
        nutritionPerUnit:
          $ref: "#/components/schemas/MacroTotals"
        microsPerUnit:
          $ref: "#/components/schemas/MicrosPerUnit"
        portion:
          $ref: "#/components/schemas/PortionBounds"
        grams:
          type: number
          minimum: 0
          description: >-
            Gram/ml equivalent when the plan states a count plus grams
            ("1 unidade (100g)" → quantity 1, unit "unidade", grams 100).
            Display + swap-equivalence aid; portion bounds still derive from
            quantity/unit.
        swaps:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/SwapOption" }
          description: >-
            The item's full substitution list in document order (this real
            plan runs up to 26 per item). The app shows a few + "+ N more"
            (N derived — no moreCount field) and the searchable sheet.
        usualSwapIndex:
          type: integer
          minimum: 0
          description: >-
            The user's usual for this item: absent/null = the original item;
            k = swaps[k] (its name/quantity shown in place, "SWAPPED" badge,
            first row of the open list becomes the ORIGINAL restore row). Set
            via PUT /plan. Persisted into the plan — NOT a one-day change
            (one-day changes remain the portions overlay). Changing it resets
            the item's portion override and recomputes `portion` from the
            swap's quantity/unit at save. Out of range on PUT → 400.

    MicrosPerUnit:
      type: object
      description: >-
        Per-1-unit micronutrient estimates for a plan item — per single egg /
        slice / g / ml, exactly like nutritionPerUnit. All fields optional:
        omitted when the source doesn't state them and the model can't
        estimate them; the app then falls back to the daily `micros` array
        (CEO 2026-07-22 #2). The shared MacroTotals is NOT extended.
      properties:
        fiberG: { type: number, minimum: 0 }
        sodiumMg: { type: number, minimum: 0 }
        ironMg: { type: number, minimum: 0 }
        calciumMg: { type: number, minimum: 0 }

    PortionBounds:
      type: object
      description: >-
        Slider bounds for the portion-adjust modal, derived by a deterministic
        backend heuristic at parse/save time — never by the model: countable
        units → 0..max(2·qty, qty+2) step 1; g → 0..2·qty rounded to step 10;
        ml → 0..2·qty rounded to step 50. Server-authoritative (client-sent
        values are ignored and recomputed on save). Absent when no usable
        quantity exists — the app keeps its portionRange fallback. Derived
        from the item's EFFECTIVE quantity/unit (v3): the usual swap's
        quantity/unit when `usualSwapIndex` is set, else the item's own.
      required: [min, max, step]
      properties:
        min: { type: number, minimum: 0 }
        max: { type: number, minimum: 0 }
        step: { type: number, exclusiveMinimum: 0 }

    PortionsMap:
      type: object
      description: >-
        Sparse portion-override map for the CURRENT eating-plan version:
        PlanItem.id → chosen quantity in the item's own EFFECTIVE unit (v3:
        the usual swap's unit when `usualSwapIndex` is set, else the item's
        own). A missing id means the item's default `quantity` (the design's
        planQty fallback). Bound to the current version; resets when a new
        version is imported. A document edit (PUT /plan) touches only the
        edited item: untouched items (same effective quantity/unit) keep
        their overrides, an edited item's override resets (effective
        quantity/unit changed — a direct edit OR a usual-swap change),
        removed items are pruned. Portion changes NEVER create plan versions
        (CEO 2026-07-22 #1).
      maxProperties: 200
      additionalProperties:
        type: number
        minimum: 0

    EatingPlanWithPortions:
      description: >-
        GET /plan response only — the same wire object as EatingPlanDraft plus
        an optional `portions` key (additive; NOT a {doc, portions} wrapper).
        Parse responses, POST/PUT echoes, and history versions never carry
        `portions`.
      allOf:
        - $ref: "#/components/schemas/EatingPlanDraft"
        - type: object
          properties:
            portions:
              $ref: "#/components/schemas/PortionsMap"

    TrainingProgramDraft:
      type: object
      description: Never persisted server-side — response only (ADR-0005).
      required: [summary, days]
      properties:
        summary:
          type: string
          maxLength: 1000
          description: Human-readable read-back shown for confirmation.
        splitDescription:
          type: string
          maxLength: 500
          description: The overall split in a phrase, e.g. "Push / Pull / Legs, 5 days".
        days:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProgramDay" }

    ProgramDay:
      type: object
      required: [name, exercises]
      properties:
        name:
          type: string
          maxLength: 100
          description: Day label, e.g. "Day 1 - Push", "Upper A".
        exercises:
          type: array
          items: { $ref: "#/components/schemas/Exercise" }
        kcalEstimate:
          type: number
          minimum: 0
          description: >-
            Optional per-day energy estimate (v3 reconciliation add) — powers
            the Today workout tab's "~{kcal}" line. Absent → the app omits
            the line (no client-side computation). 0.9.0: a hand-built day
            fills this field too — typed by the user or answered by
            POST /estimate/workout-kcal. Estimate, never a target; the "~" is
            part of the label, not decoration.

    PlanVersion:
      type: object
      description: One stored eating-plan version (history). Frozen — display only.
      required: [id, createdAt, doc]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        doc: { $ref: "#/components/schemas/EatingPlanDraft" }

    ProgramVersion:
      type: object
      description: One stored training-program version (history). Frozen — display only.
      required: [id, createdAt, doc]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        doc: { $ref: "#/components/schemas/TrainingProgramDraft" }
